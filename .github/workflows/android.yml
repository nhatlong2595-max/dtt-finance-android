name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - update.json
permissions:
  contents: write
jobs:
  build:
    name: Analyze, test, build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org vn.dttfinance
      - name: Restore stable Android signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::Add repository secret DEBUG_KEYSTORE_BASE64 before publishing updates."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Enable Android internet permission
        run: python3 tools/enable_online_updates.py
      - name: Enable Android core library desugaring
        run: python3 tools/enable_desugaring.py
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Set app version from build number
        run: |
          sed -i "s/^version:.*/version: 1.1.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtt-finance-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for online updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DTT Finance v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Update public auto-update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: 1.1.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          APK_SHA="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f 1)"
          export APK_SHA
          python3 - <<'PY'
          import json, os
          manifest = {
              "app": "DTT_Finance",
              "latestVersion": os.environ["VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "releaseNotes": "DTT Finance update",
              "apkUrl": "https://github.com/" + os.environ["REPOSITORY"] + "/releases/latest/download/app-release.apk",
              "sha256": os.environ["APK_SHA"],
              "forceFullApk": True
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          FILE_SHA="$(gh api "repos/$REPOSITORY/contents/update.json" --jq .sha)"
          CONTENT="$(base64 -w 0 update.json)"
          gh api --method PUT "repos/$REPOSITORY/contents/update.json" \
            -f message="Update DTT Finance manifest to v$VERSION" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch="main"
