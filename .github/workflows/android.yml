name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - update.json
permissions:
  contents: write
jobs:
  build:
    name: Analyze, test, build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org vn.dttfinance
      - name: Prepare DTT Finance signing key
        env:
          DTT_KEYSTORE_BASE64: ${{ secrets.DTT_FINANCE_KEYSTORE_BASE64 }}
          DTT_STORE_PASSWORD: ${{ secrets.DTT_FINANCE_STORE_PASSWORD }}
          DTT_KEY_PASSWORD: ${{ secrets.DTT_FINANCE_KEY_PASSWORD }}
        run: |
          mkdir -p android/signing
          if [ -n "$DTT_KEYSTORE_BASE64" ] && [ -n "$DTT_STORE_PASSWORD" ] && [ -n "$DTT_KEY_PASSWORD" ]; then
            printf '%s' "$DTT_KEYSTORE_BASE64" | base64 --decode > android/signing/dtt-finance.jks
            echo "DTT_STORE_PASSWORD=$DTT_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DTT_KEY_PASSWORD=$DTT_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No DTT Finance signing key configured; creating a dedicated first-run key."
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v -keystore android/signing/dtt-finance.jks -storetype JKS \
              -alias dttfinance -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=DTT Finance, OU=Mobile, O=DTT Finance, L=Ho Chi Minh City, ST=Ho Chi Minh, C=VN"
            echo "DTT_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "DTT_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            {
              echo "DTT_FINANCE_KEYSTORE_BASE64=$(base64 -w 0 android/signing/dtt-finance.jks)"
              echo "DTT_FINANCE_STORE_PASSWORD=$STORE_PASS"
              echo "DTT_FINANCE_KEY_PASSWORD=$KEY_PASS"
            } > dtt-finance-signing-secrets.txt
          fi
          cat > android/key.properties <<EOF
          storeFile=signing/dtt-finance.jks
          storePassword=$DTT_STORE_PASSWORD
          keyAlias=dttfinance
          keyPassword=$DTT_KEY_PASSWORD
          EOF
          chmod 600 android/signing/dtt-finance.jks android/key.properties
      - name: Configure dedicated DTT Finance release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'signingConfigs.create("dttRelease")' not in s:
              marker = "    buildTypes {"
              block = '''    val signingProps = java.util.Properties().apply {
                  load(rootProject.file("key.properties").inputStream())
              }
              signingConfigs {
                  create("dttRelease") {
                      storeFile = rootProject.file(signingProps.getProperty("storeFile"))
                      storePassword = signingProps.getProperty("storePassword")
                      keyAlias = signingProps.getProperty("keyAlias")
                      keyPassword = signingProps.getProperty("keyPassword")
                  }
              }
          '''
              if marker not in s:
                  raise SystemExit("Could not find Android buildTypes block")
              s = s.replace(marker, block + marker, 1)
              s = s.replace("            signingConfig = signingConfigs.getByName(\"debug\")",
                            "            signingConfig = signingConfigs.getByName(\"dttRelease\")")
              p.write_text(s)
          PY
      - name: Enable Android internet permission
        run: python3 tools/enable_online_updates.py
      - name: Enable Android core library desugaring
        run: python3 tools/enable_desugaring.py
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Set app version from build number
        run: |
          sed -i "s/^version:.*/version: 1.1.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtt-finance-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload DTT Finance signing setup (first build only)
        if: hashFiles('dtt-finance-signing-secrets.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dtt-finance-signing-secrets
          path: dtt-finance-signing-secrets.txt
          retention-days: 2
      - name: Publish GitHub Release for online updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DTT Finance v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Update public auto-update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: 1.1.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          APK_SHA="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f 1)"
          export APK_SHA
          python3 - <<'PY'
          import json, os
          manifest = {
              "app": "DTT_Finance",
              "latestVersion": os.environ["VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "releaseNotes": "DTT Finance update",
              "apkUrl": "https://github.com/" + os.environ["REPOSITORY"] + "/releases/latest/download/app-release.apk",
              "sha256": os.environ["APK_SHA"],
              "forceFullApk": True
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          FILE_SHA="$(gh api "repos/$REPOSITORY/contents/update.json" --jq .sha)"
          CONTENT="$(base64 -w 0 update.json)"
          gh api --method PUT "repos/$REPOSITORY/contents/update.json" \
            -f message="Update DTT Finance manifest to v$VERSION" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch="main"
